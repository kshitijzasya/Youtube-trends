services:
  # Daily job. Usage:
  #   docker compose run --rm yt-trends --dry-run      # print report, no Slack
  #   docker compose run --rm yt-trends                # post to Slack
  # History goes to Supabase when DATABASE_URL is set in .env, otherwise to ./data/trends.db.
  yt-trends:
    build:
      context: .
      target: runtime
    env_file: .env
    volumes:
      - ./data:/app/data                   # SQLite history (only used without DATABASE_URL)
      - ./config.yaml:/app/config.yaml:ro  # edit config without rebuilding
      - ./prompts:/app/prompts:ro          # edit prompts without rebuilding

  # Test suite against SQLite + a throwaway Postgres.
  # Usage: docker compose --profile test build && docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
